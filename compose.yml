services:
  backend:
    build:
      context: ./backend-tt
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_ADMIN: postgres://postgres:root@db:5432/ttbd
      DATABASE_URL_APP: postgres://postgres:root@db:5432/ttbd
      SESSION_SECRET: ${SESSION_SECRET:-secret_word}
      PORT: ${PORT:-7070}
    ports:
      - "${PORT:-7070}:7070"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ttbd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: {}
