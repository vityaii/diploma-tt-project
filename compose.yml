services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ttbd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5431:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ttbd"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend-tt
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_ADMIN: postgres://postgres:root@db:5432/ttbd
      DATABASE_URL_APP: postgres://postgres:root@db:5432/ttbd
      SESSION_SECRET: ${SESSION_SECRET:-secret_word}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-4ffd49f0d51b03204c24aaac280ae6b441f7e73ac0a2471b0d665220285ece50851b5912e5b5f670662b6421bd9bcaa18a7a4153f60b1657b7cf45cfa429ca33}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-e13b4e3070a0c445b0147df1acf166b5bed329c316ffa07fedd97f2e9ac3b04df287c66e038a1215b2b6df5e918c1fd5ecd695d59a0f5e47153e09d9d8c22038}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-30d}
      PORT: ${PORT:-7070}
    ports:
      - "${PORT:-7070}:7070"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend-tt/task-tracker-frontend
      dockerfile: Dockerfile
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:7070
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-tt/task-tracker-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-jdk17
    user: root
    profiles: ["infra"]
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  pgdata: {}
  frontend_node_modules: {}
  jenkins_home: {}
